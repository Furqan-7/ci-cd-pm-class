name: Next.js CI/CD Pipeline

run-name: ${{ github.actor }} triggered CI/CD workflow

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test Next.js App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./test-app

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: test-app/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint check
        run: npm run lint

      - name: 🚀 Build production Next.js app
        run: npm run build

      - name: ✅ Report CI Status
        run: echo "🎉 Build and CI validation passed successfully for AnimeVault application!"